spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Dummy key for tests to avoid context load failure
spring.ai.google.genai.api-key=dummy-key-for-testing
spring.ai.google.genai.chat.options.model=gemini-flash-latest

# Dummy mail config to satisfy JavaMailSender requirement
spring.mail.host=localhost
spring.mail.port=25

spring.application.name=jobsearch
server.port=8084

# Activate local profile for secrets
spring.profiles.active=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Job Polling Configuration
# To disable: use "-"
# To enable every hour: use "0 0 * * * *"
# To enable every 15 mins: use "0 */15 * * * *"
app.polling.cron=-

# API Keys (Placeholders)
adzuna.app-id=${ADZUNA_APP_ID:}
adzuna.app-key=${ADZUNA_APP_KEY:}
reed.api-key=${REED_API_KEY:}
hasdata.api-key=${HASDATA_API_KEY:}

spring.application.name=housepricemonitor
server.port=8081
spring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/houseprices
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# EPC API Configuration
# Register at https://epc.opendatacommunities.org/
epc.api.base-url=https://epc.opendatacommunities.org/api/v1/domestic

# Land Registry SPARQL Endpoint
landregistry.api.url=http://landregistry.data.gov.uk/landregistry/query

# Scheduling
# Poll every 24 hours (example)
app.polling.cron=0 0 0 * * *

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySearch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Auto-refresh every 15 seconds only if syncing -->
    <meta th:if="${isSyncing}" http-equiv="refresh" content="15">
</head>
<body class="bg-white text-gray-800 h-screen flex flex-col">

    <div class="flex-grow flex flex-col justify-center items-center px-4">
        
        <!-- Logo -->
        <h1 class="text-6xl font-bold mb-8 tracking-tighter">
            <span class="text-blue-500">M</span><span class="text-red-500">y</span><span class="text-yellow-500">S</span><span class="text-blue-500">e</span><span class="text-green-500">a</span><span class="text-red-500">r</span><span class="text-yellow-500">c</span><span class="text-blue-500">h</span>
        </h1>

        <!-- Search Form -->
        <form action="/" method="get" class="w-full max-w-2xl">
            <div class="relative flex items-center w-full h-12 rounded-full focus-within:shadow-lg bg-white overflow-hidden border border-gray-200 px-4 py-1">
                <div class="grid place-items-center h-full w-12 text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input
                class="peer h-full w-full outline-none text-sm text-gray-700 pr-2"
                type="text"
                name="q"
                placeholder="Search across Yahoo Mail"
                autofocus
                autocomplete="off" /> 
            </div>
            
            <div class="flex justify-center mt-6 space-x-4">
                <button type="submit" class="bg-gray-50 hover:bg-gray-100 text-sm py-2 px-6 rounded text-gray-800 border border-transparent hover:border-gray-300">MySearch</button>
            </div>
            
            <div class="flex justify-center mt-4 text-xs text-gray-400 space-x-4">
                <span th:text="'Items indexed: ' + ${totalItems}"></span>
                <span th:text="'Database size: ' + ${dbSize}"></span>
            </div>
        </form>

        <!-- Flash Message -->
        <div th:if="${message}" class="mt-8 p-4 bg-green-100 text-green-700 rounded-md">
            <p th:text="${message}"></p>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-gray-100 py-3 border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center space-x-2 text-sm text-gray-500">
                <span>Local Personal Search</span>
                <span>&bull;</span>
                <span th:text="'Synchronized at ' + ${lastSyncTime}"></span>
            </div>
            <div class="flex items-center space-x-4">
                <div th:if="${isSyncing}" class="flex items-center text-sm text-blue-600 font-medium">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Synchronizing...
                </div>
                <form action="/sync" method="post" onsubmit="document.getElementById('syncBtn').disabled=true;">
                    <button id="syncBtn" type="submit" class="text-sm text-gray-500 hover:text-gray-800 hover:underline cursor-pointer disabled:opacity-50">Sync Data Now</button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${query} + ' - MySearch'"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-title:hover { text-decoration: underline; }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex items-center border-b border-gray-200 py-4 px-6 md:px-8">
        <a href="/" class="text-2xl font-bold tracking-tighter mr-8">
            <span class="text-blue-500">M</span><span class="text-red-500">y</span><span class="text-yellow-500">S</span><span class="text-blue-500">e</span><span class="text-green-500">a</span><span class="text-red-500">r</span><span class="text-yellow-500">c</span><span class="text-blue-500">h</span>
        </a>
        
        <form action="/" method="get" class="flex-grow max-w-3xl">
            <div class="relative flex items-center w-full h-11 rounded-full focus-within:shadow-md bg-white overflow-hidden border border-gray-200 px-4 py-1 hover:shadow-md transition-shadow">
                <input
                class="peer h-full w-full outline-none text-sm text-gray-700 pr-2"
                type="text"
                name="q"
                th:value="${query}" />
                <button type="submit" class="grid place-items-center h-full w-12 text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
            </div>
        </form>

        <div class="ml-auto">
             <form action="/sync" method="post">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow">Sync</button>
            </form>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow px-6 md:px-8 lg:px-32 py-6">
        
        <div class="flex justify-between items-center mb-6">
            <p class="text-sm text-gray-500" th:text="'Showing results for: ' + ${query}"></p>
            <div class="text-xs text-gray-400 space-x-3">
                <span th:text="'Total Items: ' + ${totalItems}"></span>
                <span>&bull;</span>
                <span th:text="'DB Size: ' + ${dbSize}"></span>
            </div>
        </div>

        <div th:if="${results.isEmpty()}" class="mt-8">
            <p class="text-lg">Your search - <strong th:text="${query}"></strong> - did not match any documents.</p>
            <p class="mt-4 text-gray-600">Suggestions:</p>
            <ul class="list-disc pl-6 mt-2 text-gray-600">
                <li>Make sure all words are spelled correctly.</li>
                <li>Try different keywords.</li>
                <li>Try more general keywords.</li>
                <li>Click the Sync button if you have recently added new data.</li>
            </ul>
        </div>

        <div class="max-w-3xl space-y-8">
            <div th:each="item : ${results}" class="result-item">
                <div class="flex items-center space-x-2 text-sm text-gray-600 mb-1">
                    <span class="uppercase text-xs font-semibold bg-gray-100 px-2 py-0.5 rounded" th:text="${item.source}"></span>
                    <span>&bull;</span>
                    <span th:text="${#temporals.format(item.itemDate, 'dd MMM yyyy HH:mm')}"></span>
                </div>
                <a th:href="@{'/details/' + ${item.id}}" target="_blank" class="text-xl text-blue-800 result-title inline-block mb-1" th:text="${item.title}"></a>
                <p class="text-sm text-gray-700 leading-snug" th:text="${item.snippet}"></p>
                
                <!-- Hidden Full Content (Expandable via JS if needed later) -->
                <div class="hidden mt-2 p-3 bg-gray-50 text-sm border-l-4 border-gray-300 overflow-auto max-h-64 whitespace-pre-wrap" th:text="${item.content}"></div>
            </div>
        </div>
    <!-- Footer -->
    <footer class="bg-gray-100 py-3 border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center space-x-2 text-sm text-gray-500">
                <span>Local Personal Search</span>
                <span>&bull;</span>
                <span th:text="'Synchronized at ' + ${lastSyncTime}"></span>
            </div>
            <div class="flex items-center space-x-4">
                <div th:if="${isSyncing}" class="flex items-center text-sm text-blue-600 font-medium">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Synchronizing...
                </div>
                <form action="/sync" method="post">
                    <button id="syncBtn" type="submit" th:disabled="${isSyncing}" 
                            class="text-sm text-gray-500 hover:text-gray-800 hover:underline cursor-pointer disabled:opacity-50 disabled:no-underline disabled:cursor-not-allowed">
                        Sync Data Now
                    </button>
                </form>
            </div>
        </div>
    </footer>

</body>
</html>
v>
    </footer>

</body>
</html>
